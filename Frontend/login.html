<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | KielTech</title>
    <link rel="stylesheet" href="styles.css?v=20261021-google-button-sizing" />
  </head>
  <body>
    <header class="hero hero-small">
      <nav class="nav container">
        <div class="brand-row">
          <a class="brand" href="index.html" aria-label="KielTech home">
            <img src="KielTech-logo.png" alt="KielTech logo" class="logo-mark" />
            <span class="brand-text">KielTech</span>
          </a>
        </div>
        <div class="nav-actions">
          <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle dark and light mode">🌙</button>
        </div>
      </nav>
    </header>

    <main class="container section">
      <form id="loginForm" class="contact-form" autocomplete="on">
        <h2>Welcome back</h2>
        <input type="text" name="identifier" autocomplete="username" placeholder="Username or email" required />
        <input type="password" name="password" autocomplete="current-password" placeholder="Password" required />
        <button type="submit" class="btn btn-primary">Login</button>
        <button id="googleSignInButton" type="button" class="btn btn-secondary google-auth-button">
          <svg class="google-auth-button__icon" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
            <path fill="#4285F4" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.1h6.6c3.9-3.6 6.1-8.8 6.1-15z"/>
            <path fill="#34A853" d="M24 44c5.5 0 10.1-1.8 13.5-4.9l-6.6-5.1c-1.8 1.2-4.1 1.9-6.9 1.9-5.3 0-9.8-3.6-11.4-8.4H5.8v5.3A20 20 0 0 0 24 44z"/>
            <path fill="#FBBC05" d="M12.6 27.5a12 12 0 0 1 0-7v-5.3H5.8a20 20 0 0 0 0 17.6l6.8-5.3z"/>
            <path fill="#EA4335" d="M24 12.1c3 0 5.7 1 7.8 3.1l5.8-5.8C34.1 6.1 29.5 4 24 4A20 20 0 0 0 5.8 15.2l6.8 5.3c1.6-4.8 6.1-8.4 11.4-8.4z"/>
          </svg>
          <span>Continue with Google</span>
        </button>
        <button id="forgotPasswordButton" type="button" class="text-link" style="border:0;background:none;cursor:pointer;padding:0;text-align:left;">Forgot password?</button>
        <div id="forgotPasswordPanel" class="card hidden" role="dialog" aria-labelledby="forgotPasswordTitle" style="margin-top:1rem;padding:1rem;">
          <h3 id="forgotPasswordTitle">Reset your password</h3>
          <p class="demo-response">Enter the email used to create your account.</p>
          <input id="forgotPasswordEmail" type="email" autocomplete="email" placeholder="you@example.com" />
          <button id="forgotPasswordSubmit" type="button" class="btn btn-primary">Verify email</button>
          <button id="forgotPasswordCancel" type="button" class="btn btn-secondary">Cancel</button>
          <p id="forgotPasswordMessage" class="form-status" aria-live="polite"></p>
        </div>
        <div id="loginEmailVerificationPanel" class="hidden signup-verification-modal" role="dialog" aria-modal="true" aria-labelledby="loginEmailVerificationTitle">
          <div class="signup-verification-modal__backdrop"></div>
          <div class="signup-verification-modal__content">
            <h3 id="loginEmailVerificationTitle">Verify your email</h3>
            <p class="demo-response">This account is not verified. Enter the six-digit code we just sent. It expires in 10 minutes.</p>
            <input id="loginEmailVerificationCode" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="6-digit verification code" />
            <button id="verifyLoginEmailButton" type="button" class="btn btn-secondary">Verify and sign in</button>
            <button id="resendLoginEmailButton" type="button" class="btn btn-secondary">Resend verification email</button>
            <p id="loginEmailVerificationStatus" class="demo-response" aria-live="polite"></p>
          </div>
        </div>
        <p class="demo-response">Need an account? <a href="signup.html" class="text-link">Create one</a></p>
        <p id="authMessage" class="demo-response form-status" role="status" aria-live="polite" aria-atomic="true"></p>
      </form>
    </main>

    <script src="script.js?v=20261021-signout-google-modal" defer></script>
    <script type="module" src="firebase-google-auth.js?v=20261021-firebase-google-auth"></script>
  </body>
</html>
