<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KielTech AI Studio</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#060b12;color:#e5edf7;font-family:Inter,ui-sans-serif,system-ui,sans-serif}.shell{min-height:100vh;background:radial-gradient(circle at top left,rgba(47,111,237,.18),transparent 28%),linear-gradient(135deg,#060b12,#0d1726)}.content{margin:auto;max-width:1180px;padding:28px 24px}.topbar,.panel-heading{align-items:center;display:flex;gap:16px;justify-content:space-between}.eyebrow{color:#7dd3fc;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}.topbar h1{color:#f8fafc;font-size:clamp(1.7rem,4vw,2.5rem);margin:5px 0}.muted{color:#94a3b8;font-size:.88rem}.panel{background:rgba(12,20,32,.9);border:1px solid rgba(255,255,255,.1);border-radius:20px;box-shadow:0 14px 35px #0003;padding:22px}.stats{display:grid;gap:12px;grid-template-columns:repeat(2,1fr);margin:22px 0 16px}.stat{background:#ffffff0a;border:1px solid #ffffff14;border-radius:14px;padding:17px}.stat strong{color:#f8fafc;display:block;font-size:1.65rem;margin-top:7px}.model-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-top:16px}.model-card{background:#ffffff0a;border:1px solid #ffffff14;border-radius:14px;min-width:0;padding:16px}.model-card h3{color:#f8fafc;font-size:1rem;overflow-wrap:anywhere}.model-card strong{color:#93c5fd;display:block;font-size:1.35rem;margin-top:14px}.model-card p{line-height:1.5;margin-top:5px;overflow-wrap:anywhere}.button{background:#2f6fed33;border:1px solid #60a5fa73;border-radius:10px;color:#dbeafe;cursor:pointer;font-weight:700;padding:11px 16px}.button:hover{background:#2f6fed52}@media(max-width:720px){.content{padding:18px 14px}.stats{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}.button{width:100%}}
</style>
</head>
<script src="/admin-sidebar.js?v=20261021-firestore-role-cookie-route" defer></script>
<body><div class="shell"><main class="content"><header class="topbar"><div><p class="eyebrow">KielTech platform</p><h1>KielTech AI Studio</h1><p class="muted">Monitor model adoption and customer website delivery.</p></div><button id="refreshStudioStats" class="button" type="button">Refresh metrics</button></header><section class="stats"><article class="stat"><span class="muted">Websites built by customers</span><strong id="websitesBuilt">-</strong></article><article class="stat"><span class="muted">Websites deployed</span><strong id="websitesDeployed">-</strong></article></section><section class="panel"><div class="panel-heading"><div><p class="eyebrow">Model adoption</p><h2>AI model usage</h2></div><span id="modelUpdated" class="muted">Loading...</span></div><div id="modelGrid" class="model-grid"><p class="muted">Loading model metrics...</p></div></section></main></div><script>(()=>{const api=location.origin;async function loadStats(){const label=document.getElementById('modelUpdated');try{const r=await fetch(`${api}/admin/ai-studio-data`,{credentials:'include',cache:'no-store'}),p=await r.json().catch(()=>({}));if(!r.ok)throw Error(p.detail||'Unable to load metrics');document.getElementById('websitesBuilt').textContent=Number(p.websites_built||0).toLocaleString();document.getElementById('websitesDeployed').textContent=Number(p.websites_deployed||0).toLocaleString();document.getElementById('modelGrid').innerHTML=(p.models||[]).map(m=>`<article class="model-card"><h3>${m.display_name||m.model}</h3><strong>${Number(m.requests||0).toLocaleString()}</strong><p class="muted">requests</p><p class="muted">${Number(m.users||0).toLocaleString()} users</p><p class="muted">${m.is_ready===true&&m.is_configured===true?'Ready':'Configure model'}</p></article>`).join('')||'<p class="muted">No models are currently listed in the Admin Models catalog.</p>';label.textContent=`Updated ${new Date().toLocaleTimeString()}`}catch(e){label.textContent='Unavailable';document.getElementById('modelGrid').innerHTML=`<p class="muted">${e.message}</p>`}}document.getElementById('refreshStudioStats').addEventListener('click',loadStats);loadStats()})()</script></body></html>
