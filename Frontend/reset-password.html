<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset password | KielTech</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container section">
    <form id="passwordResetForm" class="contact-form" style="max-width:520px;margin:auto">
      <p class="eyebrow">Account recovery</p>
      <h1>Set a new password</h1>
      <p class="demo-response">Choose a new password for your KielTech account.</p>
      <input id="resetPasswordInput" type="password" autocomplete="new-password" minlength="8" placeholder="New password" required>
      <input id="resetPasswordConfirm" type="password" autocomplete="new-password" minlength="8" placeholder="Confirm password" required>
      <button class="btn btn-primary" type="submit">Save password</button>
      <p id="passwordResetMessage" class="form-status" aria-live="polite"></p>
    </form>
  </main>
  <script src="script.js"></script>
  <script>
    const resetForm = document.getElementById('passwordResetForm');
    const resetMessage = document.getElementById('passwordResetMessage');
    resetForm?.addEventListener('submit', async (event) => {
      event.preventDefault();
      const token = new URLSearchParams(window.location.search).get('token') || '';
      const password = document.getElementById('resetPasswordInput').value;
      const confirmation = document.getElementById('resetPasswordConfirm').value;
      resetMessage.textContent = 'Saving password...';
      try {
        const apiBase = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' ? 'http://127.0.0.1:8000' : window.location.origin;
        const response = await fetch(`${apiBase}/v1/auth/password-reset/complete`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({token, password, confirmation}), credentials: 'include' });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(payload.detail || 'Password reset failed.');
        resetMessage.textContent = 'Password updated. Returning to login...';
        setTimeout(() => { window.location.href = 'login.html'; }, 800);
      } catch (error) { resetMessage.textContent = error.message; }
    });
  </script>
</body>
</html>
