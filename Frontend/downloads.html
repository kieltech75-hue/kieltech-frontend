<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KielTech Downloads</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hero hero-small">
      <nav class="nav container">
        <div class="brand-row">
          <a class="brand" href="index.html" aria-label="KielTech home">
            <img src="KielTech-logo.png" alt="KielTech logo" class="logo-mark" />
            <span class="brand-text">KielTech</span>
          </a>
        </div>
        <div class="nav-actions">
          <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle dark and light mode">🌙</button>
        </div>
      </nav>
      <div class="container page-intro">
        <p class="eyebrow">Downloads</p>

    <main class="container section">
      <div id="downloadList" class="card-grid"></div>

    <footer class="footer">
      <div class="container footer-inner">
        <p>© 2026 KielTech. Practical resources for modern teams.</p>
      </div>

    <script src="script.js"></script>
