<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer account | KielTech</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #060b12; color: #e5edf7; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .shell { min-height: 100vh; background: radial-gradient(circle at top left, rgba(47,111,237,.18), transparent 28%), linear-gradient(135deg, #060b12 0%, #0d1726 100%); }
      .content { width: min(1180px, 100%); margin: 0 auto; padding: 24px; }
      .panel { background: rgba(12,20,32,.9); border: 1px solid rgba(255,255,255,.1); border-radius: 20px; box-shadow: 0 14px 35px rgba(0,0,0,.16); padding: 20px; }
      .topbar, .panel-heading, .identity, .stat-row, .key-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
      .topbar { margin-bottom: 16px; }
      .eyebrow { color: #7dd3fc; font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
      h1, h2, h3, p { margin: 0; }
      h1 { color: #f8fafc; font-size: clamp(1.5rem, 3vw, 2rem); }
      h2 { color: #f8fafc; font-size: 1.05rem; }
      h3 { color: #f8fafc; font-size: .95rem; }
      .muted { color: #94a3b8; font-size: .86rem; }
      .button { border: 1px solid rgba(255,255,255,.14); border-radius: 10px; background: rgba(255,255,255,.06); color: #cbd5e1; cursor: pointer; font-weight: 650; padding: 10px 14px; }
      .button:hover { background: rgba(47,111,237,.18); border-color: rgba(96,165,250,.55); color: #bfdbfe; }
      .button-primary { background: rgba(47,111,237,.2); border-color: rgba(96,165,250,.42); color: #dbeafe; }
      .button-danger { background: rgba(220,38,38,.16); border-color: rgba(248,113,113,.42); color: #fca5a5; }
      .button-danger:hover { background: rgba(220,38,38,.28); border-color: rgba(248,113,113,.72); color: #fee2e2; }
      .block-panel { background: rgba(127,29,29,.18); border: 1px solid rgba(248,113,113,.3); border-radius: 14px; display: none; margin-top: 12px; padding: 14px; }
      .block-panel.is-open { display: block; }
      .block-panel textarea { background: rgba(6,11,18,.82); border: 1px solid rgba(248,113,113,.28); border-radius: 10px; color: #f8fafc; min-height: 90px; padding: 10px; resize: vertical; width: 100%; }
      .block-panel textarea:focus { border-color: #f87171; box-shadow: 0 0 0 3px rgba(220,38,38,.14); outline: none; }
      .identity { align-items: flex-start; }
      .avatar { align-items: center; background: rgba(47,111,237,.18); border: 1px solid rgba(96,165,250,.35); border-radius: 14px; color: #93c5fd; display: inline-flex; flex: 0 0 52px; font-size: 1.15rem; font-weight: 750; height: 52px; justify-content: center; text-transform: uppercase; }
      .identity-copy { min-width: 0; flex: 1; }
      .identity-copy p { margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .status { border-radius: 999px; font-size: .78rem; font-weight: 700; padding: 6px 10px; white-space: nowrap; }
      .status-live { background: rgba(34,197,94,.12); border: 1px solid rgba(34,197,94,.3); color: #86efac; }
      .status-idle { background: rgba(148,163,184,.1); border: 1px solid rgba(148,163,184,.22); color: #cbd5e1; }
      .overview-grid { display: grid; gap: 16px; grid-template-columns: 1.4fr .8fr; margin-bottom: 16px; }
      .stat-row { align-items: stretch; gap: 10px; margin-top: 18px; }
      .stat { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.09); border-radius: 12px; flex: 1; padding: 14px; }
      .stat strong { color: #f8fafc; display: block; font-size: 1.15rem; margin-top: 6px; }
      .content-grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); margin-bottom: 16px; min-width: 0; }
      .content-grid > .panel, .panel-heading, .panel-heading > div { min-width: 0; }
      .card-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(190px, 100%), 1fr)); margin-top: 14px; min-width: 0; }
      .model-card, .key-card, .fund-row { min-width: 0; overflow-wrap: anywhere; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.09); border-radius: 12px; padding: 14px; }
      .model-card h3, .key-card strong, .fund-row strong { max-width: 100%; overflow-wrap: anywhere; word-break: break-word; }
      .model-card .value { color: #93c5fd; font-size: 1.25rem; font-weight: 750; line-height: 1.3; margin-top: 10px; overflow-wrap: anywhere; }
      .model-card .muted { line-height: 1.45; margin-top: 5px; overflow-wrap: anywhere; }
      .funds-panel { display: none; margin-bottom: 16px; }
      .funds-panel.is-open { display: block; }
      .fund-list, .key-list { display: grid; gap: 8px; margin-top: 14px; max-height: 340px; overflow: auto; padding-right: 4px; scrollbar-color: #475569 transparent; scrollbar-width: thin; }
      .fund-row { align-items: flex-start; display: flex; gap: 12px; justify-content: space-between; }
      .fund-row > div:first-child { min-width: 0; }
      .fund-amount { color: #6ee7b7; font-weight: 750; max-width: 45%; overflow-wrap: anywhere; text-align: right; }
      .key-card { display: grid; gap: 8px; }
      .key-heading strong { color: #f8fafc; }
      .key-meta { display: flex; flex-wrap: wrap; gap: 8px 14px; line-height: 1.45; overflow-wrap: anywhere; }
      .empty { color: #94a3b8; padding: 14px 0; }
      .error { color: #fb7185; }
      @media (max-width: 820px) { .overview-grid, .content-grid { grid-template-columns: 1fr; } .content { padding: 16px; } }
      @media (max-width: 560px) { .topbar, .identity, .stat-row, .fund-row { align-items: flex-start; flex-direction: column; } .stat-row { display: grid; grid-template-columns: 1fr; } .fund-amount { max-width: 100%; text-align: left; } .button { width: 100%; } }
    </style>
  </head>
  <script src="/admin-sidebar.js?v=20261021-firestore-role-cookie-route" defer></script>
  <body>
    <div class="shell"><main class="content">
      <div class="topbar"><div><p class="eyebrow">Customer account</p><h1 id="pageTitle">Loading account...</h1></div><div style="display:flex; gap:10px; align-items:center;"><button id="blockButton" class="button button-danger" type="button">Block account</button><button id="fundsButton" class="button button-primary" type="button">Funds log</button></div></div>
      <section id="accountPanel" class="panel"><div class="empty">Loading account details...</div></section>
      <section id="blockPanel" class="block-panel"><p class="eyebrow" style="color:#fca5a5;">Account suspension</p><h2 style="margin:5px 0 8px;">Why is this account being blocked?</h2><textarea id="blockReason" placeholder="Describe the violation or reason for the block..." maxlength="1000"></textarea><div style="display:flex; justify-content:flex-end; gap:10px; margin-top:10px;"><button id="cancelBlockButton" class="button" type="button">Cancel</button><button id="doneBlockButton" class="button button-danger" type="button">Done</button></div></section>
      <section id="fundsPanel" class="panel funds-panel"><div class="panel-heading"><div><p class="eyebrow">Wallet activity</p><h2>Funds log</h2></div><span id="fundsCount" class="muted"></span></div><div id="fundsList" class="fund-list"></div></section>
      <div class="content-grid"><section class="panel"><div class="panel-heading"><div><p class="eyebrow">Model usage</p><h2>Models used</h2></div><span id="modelCount" class="muted"></span></div><div id="modelsGrid" class="card-grid"><div class="empty">Loading model usage...</div></div></section><section class="panel"><div class="panel-heading"><div><p class="eyebrow">Developer access</p><h2>API keys</h2></div><span id="keyCount" class="muted"></span></div><div id="keysList" class="key-list"><div class="empty">Loading API keys...</div></div></section></div>
    </main></div>
    <script>
      (() => {
        const email = decodeURIComponent(window.location.pathname.split('/').filter(Boolean).pop() || '');
        const isLocal = ['localhost', '127.0.0.1', ''].includes(window.location.hostname);
        const apiBase = window.KIELTECH_API_BASE_URL
          || (isLocal
            ? `http://${window.location.hostname || 'localhost'}:8000`
            : 'https://kieltech-backend.onrender.com');
        const getAuthHeaders = (headers = {}) => {
          const token = localStorage.getItem('kieltechToken') || '';
          return { ...headers, ...(token ? { Authorization: `Bearer ${token}` } : {}) };
        };
        const esc = (value) => String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        const date = (value) => { if (!value) return '-'; const item = new Date(value); return Number.isNaN(item.getTime()) ? value : item.toLocaleString(); };
        const money = (value, currency = 'USD') => `${currency === 'USD' ? '$' : currency + ' '}${Number(value || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 6 })}`;
        const accountPanel = document.getElementById('accountPanel');
        const blockButton = document.getElementById('blockButton');
        const blockPanel = document.getElementById('blockPanel');
        const blockReason = document.getElementById('blockReason');
        const cancelBlockButton = document.getElementById('cancelBlockButton');
        async function load() {
          try {
            const response = await fetch(`${apiBase}/admin/customer-account/${encodeURIComponent(email)}`, { credentials: 'include', cache: 'no-store', headers: getAuthHeaders() });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(payload.detail || 'Unable to load customer account');
            const user = payload.user || {}; const wallet = payload.wallet || {}; const activity = payload.activity || {};
            document.title = `${user.name || user.email || 'Customer'} | KielTech`;
            document.getElementById('pageTitle').textContent = user.name || user.email || 'Customer account';
            accountPanel.innerHTML = `<div class="identity"><span class="avatar">${esc((user.name || user.email || 'C').charAt(0))}</span><div class="identity-copy"><h2>${esc(user.name || 'Unnamed user')}</h2><p class="muted">${esc(user.email || email)}</p></div><span class="status ${activity.currently_active ? 'status-live' : 'status-idle'}">${activity.currently_active ? 'Currently active' : 'Not currently active'}</span></div><div class="stat-row"><div class="stat"><span class="muted">Last active</span><strong>${esc(date(activity.last_active_at))}</strong></div><div class="stat"><span class="muted">Wallet balance</span><strong>${money(wallet.balance, wallet.currency)}</strong></div><div class="stat"><span class="muted">Account created</span><strong>${esc(date(user.created_at))}</strong></div></div>`;
            if (user.is_blocked) { blockButton.textContent = 'Unblock account'; blockButton.className = 'button button-primary'; blockButton.title = user.blocked_reason || 'Account blocked'; }
            const funds = Array.isArray(payload.funds) ? payload.funds : []; document.getElementById('fundsCount').textContent = `${funds.length} entries`; document.getElementById('fundsList').innerHTML = funds.length ? funds.map((item) => `<div class="fund-row"><div><strong>${esc(item.source_label || 'Wallet activity')}</strong><p class="muted">${esc(item.description || item.kind || 'Balance update')} · ${esc(date(item.created_at))}</p><p class="muted">${esc(item.reference || item.provider || '')}</p></div><span class="fund-amount">${money(item.amount, item.currency)}</span></div>`).join('') : '<p class="empty">No funds activity recorded.</p>';
            const models = Array.isArray(payload.models) ? payload.models : []; document.getElementById('modelCount').textContent = `${models.length} models`; document.getElementById('modelsGrid').innerHTML = models.length ? models.map((item) => `<article class="model-card"><h3>${esc(item.model)}</h3><div class="value">${Number(item.request_count || 0).toLocaleString()} requests</div><p class="muted">Consumed ${money(item.total_cost_usd)} · ${Number(item.total_tokens || 0).toLocaleString()} tokens</p><p class="muted">Last used ${esc(date(item.last_used_at))}</p></article>`).join('') : '<p class="empty">No model usage recorded.</p>';
            const keys = Array.isArray(payload.api_keys) ? payload.api_keys : []; document.getElementById('keyCount').textContent = `${keys.length} keys`; document.getElementById('keysList').innerHTML = keys.length ? keys.map((key) => `<article class="key-card"><div class="key-heading"><strong>${esc(key.name || 'Unnamed key')}</strong><span class="status ${key.active ? 'status-live' : 'status-idle'}">${key.active ? 'Active' : 'Revoked'}</span></div><p class="muted">${esc(key.masked || '')}</p><div class="key-meta"><span class="muted">${Number(key.request_count || 0).toLocaleString()} requests</span><span class="muted">Consumed ${money(key.total_cost_usd)}</span><span class="muted">Last used ${esc(date(key.last_used_at))}</span></div></article>`).join('') : '<p class="empty">No API keys created.</p>';
          } catch (error) { accountPanel.innerHTML = `<p class="error">${esc(error.message || 'Unable to load account')}</p>`; }
        }
        document.getElementById('fundsButton').addEventListener('click', () => { const panel = document.getElementById('fundsPanel'); const open = panel.classList.toggle('is-open'); document.getElementById('fundsButton').textContent = open ? 'Hide funds log' : 'Funds log'; });
        blockButton.addEventListener('click', async () => { if (blockButton.textContent.startsWith('Unblock')) { blockButton.disabled = true; const response = await fetch(`${apiBase}/admin/users/${encodeURIComponent(email)}/block`, { method: 'POST', headers: getAuthHeaders({'Content-Type':'application/json'}), credentials: 'include', body: JSON.stringify({ blocked: false }) }); blockButton.disabled = false; if (!response.ok) { const payload = await response.json().catch(() => ({})); alert(payload.detail || 'Unable to unblock account'); return; } blockButton.textContent = 'Block account'; blockButton.className = 'button button-danger'; blockButton.title = ''; await load(); return; } blockPanel.classList.toggle('is-open'); if (blockPanel.classList.contains('is-open')) blockReason.focus(); });
        cancelBlockButton.addEventListener('click', () => { blockPanel.classList.remove('is-open'); blockReason.value = ''; });
        document.getElementById('doneBlockButton').addEventListener('click', async () => { const reason = blockReason.value.trim(); if (!reason) { blockReason.focus(); return; } const response = await fetch(`${apiBase}/admin/users/${encodeURIComponent(email)}/block`, { method: 'POST', headers: getAuthHeaders({'Content-Type':'application/json'}), credentials: 'include', body: JSON.stringify({ blocked: true, reason }) }); const payload = await response.json().catch(() => ({})); if (!response.ok) { alert(payload.detail || 'Unable to block account'); return; } blockPanel.classList.remove('is-open'); blockReason.value = ''; await load(); });
        load();
      })();
    </script>
  </body>
</html>
