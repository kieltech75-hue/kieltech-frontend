<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Manage KielTech administrator access.">
  <title>Owner access | KielTech</title>
  <script>
    document.documentElement.classList.add('kt-admin-auth-pending');
  </script>
  <style>
    html.kt-admin-auth-pending body { visibility: hidden; }
    body { margin: 0; min-height: 100vh; background: #071726; color: #eaf5ff; font: 16px/1.5 Inter, ui-sans-serif, system-ui, sans-serif; }
    .owner-page { box-sizing: border-box; width: min(100% - 2rem, 1100px); margin: 0 auto; padding: 3.5rem 0; }
    .owner-header { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: 1.5rem; }
    .owner-eyebrow { margin: 0 0 .4rem; color: #35c9f4; font-size: .75rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(1.8rem, 5vw, 2.5rem); line-height: 1.15; }
    .owner-intro { max-width: 680px; margin: .75rem 0 0; color: #a9bfd0; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .owner-link { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: .45rem .85rem; border: 1px solid rgba(53,201,244,.3); border-radius: 10px; color: #dff7ff; text-decoration: none; }
    .owner-card { overflow: hidden; border: 1px solid rgba(53,201,244,.2); border-radius: 18px; background: linear-gradient(145deg,rgba(20,54,79,.58),rgba(8,25,43,.72)); box-shadow: 0 18px 48px rgba(0,0,0,.18); backdrop-filter: blur(18px); }
    .owner-card__head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .75rem; padding: 1.1rem 1.25rem; border-bottom: 1px solid rgba(53,201,244,.15); }
    .owner-card__head h2 { margin: 0; font-size: 1rem; }
    .owner-search { box-sizing: border-box; width: min(100%, 280px); min-height: 40px; padding: .5rem .7rem; border: 1px solid rgba(53,201,244,.24); border-radius: 9px; background: #071726; color: #eaf5ff; font: inherit; }
    .owner-message { min-height: 1.5rem; margin: 0; padding: .6rem 1.25rem; color: #a9bfd0; }
    .owner-message[data-state="error"] { color: #fca5a5; }
    .owner-message[data-state="success"] { color: #86efac; }
    .owner-table-wrap { overflow-x: auto; }
    .owner-table { width: 100%; border-collapse: collapse; text-align: left; }
    .owner-table th,.owner-table td { padding: .85rem 1.25rem; border-top: 1px solid rgba(53,201,244,.12); vertical-align: middle; }
    .owner-table th { color: #91aabd; font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .owner-table td { color: #dceaf4; font-size: .9rem; }
    .owner-table small { display: block; color: #91aabd; }
    .owner-role { display: inline-flex; padding: .22rem .55rem; border: 1px solid rgba(53,201,244,.25); border-radius: 999px; color: #aeeaff; font-size: .75rem; font-weight: 700; }
    .owner-action { min-height: 34px; padding: .35rem .65rem; border: 1px solid rgba(53,201,244,.3); border-radius: 8px; background: rgba(53,201,244,.1); color: #dff7ff; cursor: pointer; font: inherit; font-size: .8rem; font-weight: 650; white-space: nowrap; }
    .owner-action--remove { border-color: rgba(248,113,113,.35); background: rgba(248,113,113,.1); color: #fecaca; }
    .owner-action:disabled { cursor: not-allowed; opacity: .55; }
    .owner-empty { padding: 1.5rem 1.25rem; color: #a9bfd0; }
    @media (max-width: 650px) { .owner-page { padding-top: 2rem; } .owner-table th,.owner-table td { padding: .75rem; } }
  </style>
  <script src="/admin-sidebar.js?v=20261022-owner-role-management" defer></script>
  <script src="/admin-owner.js?v=20261022-owner-role-management" defer></script>
</head>
<body>
  <main class="owner-page">
    <header class="owner-header">
      <div>
        <p class="owner-eyebrow">KielTech owner console</p>
        <h1>Administrator access</h1>
        <p class="owner-intro">Grant or revoke administrator access for Google-linked KielTech accounts. Owner roles are protected and cannot be changed here.</p>
      </div>
      <a class="owner-link" href="/admin/dashboard">Admin dashboard</a>
    </header>
    <section class="owner-card" aria-labelledby="linkedAccountsTitle">
      <div class="owner-card__head">
        <h2 id="linkedAccountsTitle">Google-linked accounts</h2>
        <label>
          <span class="visually-hidden">Filter accounts</span>
          <input id="ownerUserSearch" class="owner-search" type="search" placeholder="Search name, username, or email">
        </label>
      </div>
      <p id="ownerRoleStatus" class="owner-message" role="status" aria-live="polite">Loading linked accounts…</p>
      <div class="owner-table-wrap">
        <table class="owner-table">
          <thead><tr><th scope="col">Account</th><th scope="col">Role</th><th scope="col">Access</th></tr></thead>
          <tbody id="ownerUserRows"></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
