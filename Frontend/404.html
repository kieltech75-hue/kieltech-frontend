<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071b33">
  <meta name="robots" content="noindex">
  <title>Page Not Found | KielTech</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", Arial, sans-serif; background: #071b33; color: #eff9ff; }
    * { box-sizing: border-box; }
    body { display: grid; min-width: 320px; min-height: 100vh; min-height: 100dvh; margin: 0; padding: 1.5rem; place-items: center; background: radial-gradient(ellipse at 50% 38%, rgba(35, 151, 216, .24), transparent 52%), linear-gradient(145deg, #061426, #0a2a4c 55%, #071b33); }
    main { width: min(100%, 520px); padding: clamp(2rem, 7vw, 3.5rem); border: 1px solid rgba(125, 211, 252, .24); border-radius: 22px; background: rgba(7, 25, 45, .78); box-shadow: 0 24px 80px rgba(0, 0, 0, .32), inset 0 1px rgba(255, 255, 255, .06); text-align: center; }
    img { display: block; width: 84px; height: 84px; margin: 0 auto 1.5rem; object-fit: contain; filter: drop-shadow(0 0 22px rgba(56, 189, 248, .38)); }
    h1 { margin: 0; color: #f3faff; font-size: clamp(2rem, 7vw, 3.25rem); letter-spacing: -.045em; line-height: 1.08; }
    p { margin: 1rem 0 0; color: #b8d0e2; font-size: 1rem; line-height: 1.65; }
    nav { display: flex; flex-wrap: wrap; justify-content: center; gap: .75rem; margin-top: 2rem; }
    a { display: inline-flex; min-height: 44px; align-items: center; justify-content: center; padding: .7rem 1rem; border: 1px solid rgba(125, 211, 252, .3); border-radius: 8px; color: #e9f8ff; font-size: .9rem; font-weight: 650; text-decoration: none; transition: border-color .16s ease, background .16s ease, transform .16s ease; }
    a:first-child { border-color: #38bdf8; background: #38bdf8; color: #06213a; }
    a:hover { transform: translateY(-1px); border-color: #7dd3fc; background-color: rgba(56, 189, 248, .12); }
    a:first-child:hover { background: #7dd3fc; }
    a:focus-visible { outline: 2px solid #bae6fd; outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main>
    <img src="/KielTech-logo.png" alt="KielTech">
    <h1>Page Not Found</h1>
    <p>The page you’re looking for may have moved, or the address may be incorrect.</p>
    <nav aria-label="Helpful links">
      <a href="/">Go to homepage</a>
      <a href="/models.html">Browse models</a>
    </nav>
  </main>
</body>
</html>
