<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Edit credentials | KielTech</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container section">
    <form id="credentialsForm" class="contact-form" style="max-width:560px;margin:auto">
      <p class="eyebrow">Account credentials</p>
      <h1>Edit your credentials</h1>
      <p class="demo-response">Set or update your password and username or email. Leave the password fields blank to keep your current password.</p>
      <input id="credentialsUsername" type="text" autocomplete="username" placeholder="Username">
      <input id="credentialsEmail" type="email" autocomplete="email" placeholder="Account email">
      <input id="credentialsPassword" type="password" autocomplete="new-password" minlength="8" placeholder="New password (optional)">
      <input id="credentialsPasswordConfirm" type="password" autocomplete="new-password" minlength="8" placeholder="Confirm new password">
      <button class="btn btn-primary" type="submit">Save changes</button>
      <p id="credentialsMessage" class="form-status" aria-live="polite"></p>
    </form>
  </main>
  <script src="script.js"></script>
  <script>
    const credentialsForm = document.getElementById('credentialsForm');
    const credentialsMessage = document.getElementById('credentialsMessage');
    credentialsForm?.addEventListener('submit', async (event) => {
      event.preventDefault();
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token') || '';
      const password = document.getElementById('credentialsPassword').value;
      const confirmation = document.getElementById('credentialsPasswordConfirm').value;
      if (password !== confirmation) { credentialsMessage.textContent = 'Passwords must match.'; return; }
      credentialsMessage.textContent = 'Saving changes...';
      try {
        const apiBase = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' ? 'http://127.0.0.1:8000' : window.location.origin;
        const response = await fetch(`${apiBase}/v1/auth/credentials/complete`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({token, username: document.getElementById('credentialsUsername').value, email: document.getElementById('credentialsEmail').value, password}), credentials: 'include' });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(payload.detail || 'Credential update failed.');
        credentialsMessage.textContent = 'Credentials updated. Returning to Settings...';
        setTimeout(() => { window.location.href = 'settings.html'; }, 800);
      } catch (error) { credentialsMessage.textContent = error.message; }
    });
  </script>
</body>
</html>
