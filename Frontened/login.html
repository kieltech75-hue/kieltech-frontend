<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | KielTech</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hero hero-small">
      <nav class="nav container">
        <a class="brand" href="index.html">KielTech</a>
        <div class="nav-actions">
          <div class="nav-links">
            <a href="about.html">About</a>
            <a href="services.html">Services</a>
            <a href="downloads.html">Downloads</a>
            <a href="contact.html">Contact</a>
            <a href="login.html">Login</a>
            <a href="dashboard.html">Dashboard</a>
          </div>
          <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle dark and light mode">🌙</button>
        </div>
      </nav>
    </header>

    <main class="container section">
      <form id="loginForm" class="contact-form">
        <h2>Welcome back</h2>
        <input type="email" name="email" placeholder="Email" required />
        <input type="password" name="password" placeholder="Password" required />
        <button type="submit" class="btn btn-primary">Login</button>
        <p class="demo-response">Need an account? <a href="signup.html" class="text-link">Create one</a></p>
        <p id="authMessage" class="demo-response"></p>
      </form>
    </main>

    <script src="script.js"></script>
  </body>
</html>
